# ~/.config/hypr/hyprlock.conf  (PrymX - Tokyo Night)
# Bound to Mod+Alt+L in niri, and used by hypridle on idle.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(26, 27, 38, 1.0)
    blur_passes = 2
    blur_size = 6
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgb(7aa2f7)
    inner_color = rgb(1a1b26)
    font_color = rgb(c0caf5)
    check_color = rgb(e0af68)
    fail_color = rgb(f7768e)
    fade_on_empty = false
    placeholder_text = <i>Password</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    rounding = 8
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(192, 202, 245, 1.0)
    font_size = 68
    font_family = JetBrainsMono Nerd Font
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = $DESC
    color = rgba(122, 162, 247, 1.0)
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}
