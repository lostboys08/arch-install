# ~/.config/fuzzel/fuzzel.ini  (PrymX - Tokyo Night)
# Kept as a dependency-free fallback launcher; vicinae is bound to Mod+Space.

[main]
font=JetBrainsMono Nerd Font:size=12
terminal=ghostty -e
layer=overlay
width=45
lines=12
horizontal-pad=24
vertical-pad=16
inner-pad=8
tabs=4

[colors]
background=1a1b26ee
text=c0caf5ff
match=7aa2f7ff
selection=283457ff
selection-text=c0caf5ff
selection-match=7aa2f7ff
border=7aa2f7ff

[border]
width=2
radius=8
