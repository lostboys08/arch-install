# ~/.config/tmux/tmux.conf

# Ctrl-a is easier to reach than Ctrl-b
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:Tc,*256col*:Tc"
set -g default-shell /usr/bin/fish

set -g mouse on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on

# 1-based, gap-free window numbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# Splits that keep the current working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Status line
set -g status-position bottom
set -g status-style "fg=#c0caf5,bg=#1a1b26"
set -g status-left "#[bold] #S "
set -g status-left-length 30
set -g status-right "#[fg=#7aa2f7]%Y-%m-%d #[fg=#c0caf5]%H:%M "
setw -g window-status-current-style "fg=#1a1b26,bg=#7aa2f7,bold"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
